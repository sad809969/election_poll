server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for high performance web loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for immutable flutter static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|ttf|otf|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ensure index.html and service worker are never stale
    location ~* (index\.html|flutter_service_worker\.js|version\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
